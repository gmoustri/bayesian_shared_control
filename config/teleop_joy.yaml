teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    stamped_twist_frame: base_link 
    require_enable_button: true
    enable_button: 5          # R1 on many PS4 mappings
    enable_turbo_button: 4    # L1 (optional)
    axis_linear:
      x: 1                    # left stick up/down often = 1
    scale_linear:
      x: 0.6
    scale_linear_turbo:
      x: 1.2
    axis_angular:
      yaw: 0                  # left stick left/right often = 0
    scale_angular:
      yaw: 1.8
    scale_angular_turbo:
      yaw: 2.5
